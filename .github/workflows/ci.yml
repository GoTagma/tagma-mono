name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Keep the embedded runtime's filesystem/module boundary native on every
  # desktop OS. Exercise both a fresh profile and the real 1.17.8 -> current ->
  # 1.17.8 -> current database lineage with the published SDK clients.
  managed-opencode-runtime:
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: |
            apps/electron/build/opencode
            apps/electron/build/opencode-upgrade-fixture
          key: managed-opencode-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/electron/package.json', 'apps/electron/scripts/fetch-opencode.mjs', 'apps/electron/scripts/fetch-opencode-upgrade-fixture.mjs') }}

      - name: Stage pinned OpenCode binary
        working-directory: apps/electron
        run: bun ./scripts/fetch-opencode.mjs

      - name: Stage pre-upgrade OpenCode fixture
        working-directory: apps/electron
        run: bun ./scripts/fetch-opencode-upgrade-fixture.mjs

      - name: Managed runtime unit contracts
        working-directory: apps/editor
        run: bun scripts/test-serial.mjs --file tests/opencode-managed-tools.test.ts --file tests/opencode-lifecycle.test.ts --file tests/opencode-database.test.ts --file tests/opencode-seed-document-budget.test.ts --file tests/chat-trial-semantic-review.test.ts --file tests/opencode-trial-semantic-review.test.ts --file tests/chat-trial-workspace-input-boundary.test.ts --file tests/chat-trial-json-value-contract.test.ts

      - name: Non-core Trial source relation admission
        working-directory: apps/editor
        run: bun test tests/chat-trial-file-source-text-occurrence.test.ts --test-name-pattern "non-core source relation"

      - name: Deterministic content preservation contracts
        working-directory: apps/editor
        run: bun test tests/opencode-deterministic-content-contract.test.ts

      - name: Managed and ordinary command environment boundaries
        working-directory: apps/editor
        run: bun scripts/test-serial.mjs --file tests/opencode-host-env.test.ts --file tests/opencode-command-env.test.ts

      - name: Trial source dependency reference contracts
        working-directory: apps/editor
        run: bun test tests/chat-trial-source-dependency-resolution.test.ts

      - name: Trial positive core qualification
        working-directory: apps/editor
        run: bun test tests/chat-trial-semantic-review-runtime.test.ts --test-name-pattern "normal core qualification"

      - name: Trial public path coordinate contracts
        working-directory: apps/editor
        run: bun test tests/chat-pipeline-trial-plan-tool-boundary.test.ts --test-name-pattern "existing namespace mapping|begin coordinate"

      - name: Native OpenCode ToolRegistry smoke
        working-directory: apps/editor
        env:
          TAGMA_OPENCODE_NATIVE_SMOKE: '1'
        run: bun test tests/opencode-managed-runtime-smoke.test.ts --timeout 360000

      - name: Native staged repair and counted Trial transport
        working-directory: apps/editor
        env:
          TAGMA_OPENCODE_NATIVE_SMOKE: '1'
        run: bun test tests/opencode-trial-plan-schema-smoke.test.ts tests/opencode-stage-scope-native.test.ts --timeout 360000

      - name: Native OpenCode V2 question conformance
        working-directory: apps/editor
        env:
          TAGMA_OPENCODE_NATIVE_SMOKE: '1'
        run: bun test tests/opencode-v2-question-conformance.test.ts --timeout 360000

      - name: Native independent Trial content review
        working-directory: apps/editor
        env:
          TAGMA_OPENCODE_NATIVE_SMOKE: '1'
        run: bun test tests/opencode-trial-semantic-review-native.test.ts --timeout 360000

      - name: Native OpenCode database upgrade and downgrade smoke
        working-directory: apps/editor
        env:
          TAGMA_OPENCODE_NATIVE_UPGRADE_SMOKE: '1'
        run: bun test tests/opencode-managed-upgrade-smoke.test.ts --timeout 1500000

  # Full repository gate: every check, lint, and test the repo runs on push
  # to main. Triggers on:
  #   - push to main
  #   - pull_request from a branch in the same repository.
  # Required so that any change which can affect apps/electron, apps/editor
  # or anything depending on them is gated before merge, not after.
  full-check:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Node proof runtime
        run: node --test-isolation=none --version

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match `packageManager` in root package.json.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Text hygiene
        run: bun run check:text

      - name: Dependency & lockfile integrity
        run: bun run check:deps

      - name: Focused and disabled tests
        run: bun run check:focus

      - name: Phantom imports
        run: bun run check:imports

      - name: Workspace dependency cycles
        run: bun run check:cycles

      - name: Secret scan
        run: bun run check:secrets

      - name: Format check
        run: bun run format:check

      - name: Publish metadata check
        run: bun run check:publish

      - name: Type check
        run: bun run check

      - name: Current source regression ledger
        run: bun run test:current-regressions

      - name: Script tests
        run: bun run test:scripts

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

  # Degraded gate for fork PRs: keep untrusted forks on public packages only.
  # `full-check` still runs once a maintainer pulls the change into a same-repo
  # branch.
  public-check-fork:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match `packageManager` in root package.json.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Text hygiene
        run: bun run check:text

      - name: Dependency & lockfile integrity
        run: bun run check:deps

      - name: Focused and disabled tests
        run: bun run check:focus

      - name: Phantom imports
        run: bun run check:imports

      - name: Workspace dependency cycles
        run: bun run check:cycles

      - name: Secret scan
        run: bun run check:secrets

      - name: Format check
        run: bun run format:check

      - name: Type check public packages
        run: bun run check:public

      - name: Test public packages
        run: bun run test:public

      - name: Lint public packages
        run: bun run lint:public
